services:
  - type: web
    name: ai-risk-manager
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
    healthCheckPath: /health
